<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the food content app!</title>
    <link href="{{ url_for('static', filename='styles/style.css')}}" rel="stylesheet" />
    <!-- jQuery and jQuery UI for autocomplete -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.8.16/jquery-ui.js"></script>
    <link href="http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.16/themes/ui-lightness/jquery-ui.css" rel="stylesheet" />
</head>
<body>
    <section class="welcoming-page">
        <!-- Main app title -->
        <h1 class="main-title">Welcome to the food content app!</h1>
        <!-- Food heading -->
        <h2 class="food-label">Type a food name:</h2>
        <!-- Nutrients heading -->
        <h2 class="nutrients-label">Select nutrients:</h2>
        <form action="{{ url_for('get_content') }}">
            <!-- Food input box -->
            <input type="text" name="food" id="food" class="food-input" placeholder="Enter food name here" />
            <!-- Nutrients multi-select box -->
            <select id="nutrients" name="nutrients" class="nutrients-select" multiple size="8">
                {% for nutrient in nutrient_columns %}
                    <option value="{{ nutrient }}">{{ nutrient }}</option>
                {% endfor %}
            </select>
            <!-- Submit button -->
            <button type="submit" class="submit-btn">Submit</button>
        </form>
        <!-- Autocomplete for food input -->
        <script>
        $(function () {
            var availableEntries = [
                {% for entry in entries %}
                    "{{entry}}",
                {% endfor %}
            ];
            $("#food").autocomplete({
                source: availableEntries
            });
        });
        </script>
    </section>
</body>
</html>
